<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>remote-lab viewer</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: #111; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }
    #bar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 6px 10px; background: rgba(0,0,0,0.55);
      font-size: 12px; z-index: 10; display: flex; gap: 12px;
    }
    #bar b { color: #fff; }
    #bar .ok { color: #4ade80; }
    #bar .err { color: #f87171; }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; overflow: hidden;
    }
    #screen {
      max-width: 100%; max-height: 100%;
      image-rendering: auto;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
      transform-origin: center center; will-change: transform;
    }
    #zoomBtn {
      position: fixed; bottom: 28px; left: 12px;
      padding: 4px 10px; cursor: pointer;
      background: rgba(0,0,0,0.55); color: #eee; border: 0; border-radius: 4px; font-size: 12px;
    }
    #help { position: fixed; bottom: 8px; left: 8px; right: 8px;
      font-size: 11px; opacity: 0.6; text-align: center; }
    #clipToggle {
      position: fixed; bottom: 28px; right: 12px;
      padding: 4px 10px; cursor: pointer;
      background: rgba(0,0,0,0.55); color: #eee; border: 0; border-radius: 4px; font-size: 12px;
    }
    #clip {
      position: fixed; bottom: 28px; right: 12px;
      display: flex; flex-direction: column; gap: 4px;
      background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px;
      font-size: 12px; max-width: 280px;
    }
    #clip textarea {
      width: 240px; min-height: 60px; resize: vertical;
      background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
      font-family: inherit; font-size: 12px; padding: 4px;
    }
    #clip .row { display: flex; gap: 6px; justify-content: flex-end; }
    #clip button {
      padding: 4px 10px; cursor: pointer;
      background: #2563eb; color: #fff; border: 0; border-radius: 4px; font-size: 12px;
    }
    #clip button.secondary { background: #444; }
    #clip button:hover { filter: brightness(1.15); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="bar">
    <span>remote-lab</span>
    <span id="status">connecting…</span>
    <span id="size"></span>
    <span id="fps"></span>
  </div>

  <div id="stage">
    <img id="screen" alt="remote screen" draggable="false" />
  </div>

  <div id="help">Tap = click • Long-press = right-click • Pinch = zoom • Drag to pan when zoomed</div>

  <button id="zoomBtn" type="button">Zoom 1×</button>
  <button id="clipToggle" type="button">Clipboard</button>
  <div id="clip" class="hidden">
    <textarea id="clipText" placeholder="Type or paste here, then Send to push to host clipboard."></textarea>
    <div class="row">
      <button id="clipClose" class="secondary" type="button">Close</button>
      <button id="clipSend" type="button">Send to host</button>
    </div>
  </div>

<script>
(() => {
  const status = document.getElementById('status');
  const sizeEl = document.getElementById('size');
  const fpsEl  = document.getElementById('fps');
  const img    = document.getElementById('screen');
  const stage  = document.getElementById('stage');

  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const token = (window.__TOKEN__ || new URLSearchParams(location.search).get('token') || '').toString();
  const wsUrl = `${wsProto}//${location.host}/${token ? '?token=' + encodeURIComponent(token) : ''}`;
  const ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  let lastUrl = null;
  let frames = 0;
  let lastFpsT = performance.now();

  ws.onopen    = () => { status.textContent = 'connected'; status.className = 'ok'; };
  ws.onerror   = () => { status.textContent = 'error';     status.className = 'err'; };
  ws.onclose   = () => { status.textContent = 'closed';    status.className = 'err'; };

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      try {
        const msg = JSON.parse(ev.data);
        if (msg && msg.type === 'welcome' && msg.host) {
          status.textContent = `connected · ${msg.host}`;
        }
      } catch (_) {}
      return;
    }
    if (!(ev.data instanceof ArrayBuffer)) return;
    const u8 = new Uint8Array(ev.data);
    if (u8.length < 9 || u8[0] !== 0xF1) return;
    const dv = new DataView(ev.data);
    const w = dv.getUint32(1, true);
    const h = dv.getUint32(5, true);
    const jpeg = u8.subarray(9);

    const blob = new Blob([jpeg], { type: 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
    img.src = url;
    sizeEl.textContent = `${w}×${h}`;

    frames++;
    const now = performance.now();
    if (now - lastFpsT > 1000) {
      fpsEl.textContent = `${frames} fps`;
      frames = 0;
      lastFpsT = now;
    }
  };

  function send(obj) {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // ---- Clipboard panel ----
  const clip = document.getElementById('clip');
  const clipToggle = document.getElementById('clipToggle');
  const clipClose = document.getElementById('clipClose');
  const clipSend = document.getElementById('clipSend');
  const clipText = document.getElementById('clipText');
  function showClip(show) {
    clip.classList.toggle('hidden', !show);
    clipToggle.classList.toggle('hidden', show);
  }
  clipToggle.addEventListener('click', () => showClip(true));
  clipClose.addEventListener('click', () => showClip(false));
  clipSend.addEventListener('click', () => {
    const text = clipText.value || '';
    if (!text) return;
    send({ type: 'clipboard_write', text });
    showClip(false);
  });

  function imgRect() { return img.getBoundingClientRect(); }

  function normalize(clientX, clientY) {
    const r = imgRect();
    if (r.width <= 0 || r.height <= 0) return null;
    const x = (clientX - r.left) / r.width;
    const y = (clientY - r.top)  / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return null;
    return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
  }

  // ---- Mouse (desktop browsers) ----
  stage.addEventListener('mousemove', (e) => {
    const n = normalize(e.clientX, e.clientY); if (!n) return;
    send({ type: 'mouse_move', x: n.x, y: n.y });
  });
  stage.addEventListener('mousedown', (e) => {
    const n = normalize(e.clientX, e.clientY); if (!n) return;
    send({ type: 'mouse_move', x: n.x, y: n.y });
    send({ type: 'mouse_down', button: e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left' });
    e.preventDefault();
  });
  stage.addEventListener('mouseup', (e) => {
    send({ type: 'mouse_up', button: e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left' });
  });
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  stage.addEventListener('wheel', (e) => {
    send({ type: 'scroll', dx: e.deltaX, dy: -e.deltaY });
    e.preventDefault();
  }, { passive: false });

  // ---- Local zoom / pan (viewer-side only; never sent to host) ----
  // Pinch to zoom the remote image, drag to pan when zoomed. Tap/scroll input
  // still maps correctly because normalize() reads the transformed rect.
  let zoom = 1, panX = 0, panY = 0;
  const zoomBtn = document.getElementById('zoomBtn');
  function clampPan() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const iw = img.clientWidth * zoom, ih = img.clientHeight * zoom;
    const maxX = Math.max(0, (iw - vw) / 2 + 40);
    const maxY = Math.max(0, (ih - vh) / 2 + 40);
    panX = Math.max(-maxX, Math.min(maxX, panX));
    panY = Math.max(-maxY, Math.min(maxY, panY));
  }
  function applyTransform() {
    if (zoom <= 1.001) { zoom = 1; panX = 0; panY = 0; }
    clampPan();
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    zoomBtn.textContent = `Zoom ${zoom.toFixed(1)}×`;
  }
  zoomBtn.addEventListener('click', () => {
    zoom = zoom > 1 ? 1 : 2; panX = 0; panY = 0; applyTransform();
  });

  // ---- Touch (mobile) ----
  let touchStart = null, longPressTimer = null, longPressed = false;
  let oneFingerLast = null;
  let twoFingerLastDist = null, twoFingerLastX = null, twoFingerLastY = null;

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY, t: performance.now() };
      oneFingerLast = { x: t.clientX, y: t.clientY };
      if (zoom === 1) {
        const n = normalize(t.clientX, t.clientY);
        if (n) send({ type: 'mouse_move', x: n.x, y: n.y });
      }
      longPressed = false;
      longPressTimer = setTimeout(() => {
        if (zoom !== 1) return;
        longPressed = true;
        send({ type: 'mouse_down', button: 'right' });
        send({ type: 'mouse_up',   button: 'right' });
      }, 550);
    } else if (e.touches.length === 2) {
      clearTimeout(longPressTimer);
      const [a, b] = e.touches;
      twoFingerLastDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      twoFingerLastX = (a.clientX + b.clientX) / 2;
      twoFingerLastY = (a.clientY + b.clientY) / 2;
    }
    e.preventDefault();
  }, { passive: false });

  stage.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && touchStart) {
      const t = e.touches[0];
      if (Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y) > 8) {
        clearTimeout(longPressTimer);
      }
      if (zoom > 1) {
        // Pan the zoomed view instead of moving the remote cursor.
        if (oneFingerLast) {
          panX += t.clientX - oneFingerLast.x;
          panY += t.clientY - oneFingerLast.y;
          applyTransform();
        }
        oneFingerLast = { x: t.clientX, y: t.clientY };
      } else {
        const n = normalize(t.clientX, t.clientY);
        if (n) send({ type: 'mouse_move', x: n.x, y: n.y });
      }
    } else if (e.touches.length === 2 && twoFingerLastDist !== null) {
      const [a, b] = e.touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const cx = (a.clientX + b.clientX) / 2;
      const cy = (a.clientY + b.clientY) / 2;
      const ratio = twoFingerLastDist > 0 ? dist / twoFingerLastDist : 1;
      zoom = Math.max(1, Math.min(5, zoom * ratio));
      if (zoom > 1) {
        // Zoomed: pinch zooms, two-finger drag pans. Nothing sent to host.
        panX += cx - twoFingerLastX;
        panY += cy - twoFingerLastY;
        applyTransform();
      } else {
        // Not zoomed: two-finger drag scrolls the remote screen (as before).
        send({ type: 'scroll', dx: cx - twoFingerLastX, dy: cy - twoFingerLastY });
        applyTransform();
      }
      twoFingerLastDist = dist; twoFingerLastX = cx; twoFingerLastY = cy;
    }
    e.preventDefault();
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    clearTimeout(longPressTimer);
    if (touchStart && !longPressed && zoom === 1 && e.touches.length === 0) {
      const ct = e.changedTouches[0];
      const moved = ct ? Math.hypot(ct.clientX - touchStart.x, ct.clientY - touchStart.y) : 0;
      const dt = performance.now() - touchStart.t;
      if (dt < 350 && moved < 10) {
        if (ct) { const n = normalize(ct.clientX, ct.clientY); if (n) send({ type: 'mouse_move', x: n.x, y: n.y }); }
        send({ type: 'mouse_down', button: 'left' });
        send({ type: 'mouse_up',   button: 'left' });
      }
    }
    if (e.touches.length < 2) { twoFingerLastDist = null; }
    if (e.touches.length === 0) { touchStart = null; oneFingerLast = null; }
    e.preventDefault();
  }, { passive: false });

  // ---- Keyboard (desktop browsers) ----
  const NAMED = {
    'Enter':'return','Tab':'tab',' ':'space','Backspace':'backspace','Escape':'escape','Delete':'delete',
    'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right',
    'Home':'home','End':'end','PageUp':'pageup','PageDown':'pagedown',
    'F1':'f1','F2':'f2','F3':'f3','F4':'f4','F5':'f5','F6':'f6','F7':'f7','F8':'f8','F9':'f9','F10':'f10','F11':'f11','F12':'f12',
    'Shift':'shift','Control':'control','Alt':'alt','Meta':'meta'
  };
  function keyName(e) {
    if (NAMED[e.key]) return NAMED[e.key];
    if (e.key.length === 1) return e.key.toLowerCase();
    return null;
  }
  function typingInClipboard() {
    return clipText === document.activeElement || (clip && !clip.classList.contains('hidden'));
  }
  window.addEventListener('keydown', (e) => {
    if (typingInClipboard()) return;
    const k = keyName(e); if (!k) return;
    send({ type: 'key_down', key: k });
    if (e.key !== 'F5' && e.key !== 'F12') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (typingInClipboard()) return;
    const k = keyName(e); if (!k) return;
    send({ type: 'key_up', key: k });
  });
})();
</script>
</body>
</html>
